<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Request Time Off')}"></head>
<body class="app-body">

<div class="app-shell">
    <th:block th:replace="~{fragments/layout :: sidebar('leave')}"></th:block>

    <div class="main-content">
        <th:block th:replace="~{fragments/layout :: topbar('Request Time Off')}"></th:block>

        <main class="content-area">
            <!-- Header -->
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="h3 mb-1">Request Time Off</h2>
                    <p class="text-secondary mb-0">Submit a new leave request for approval.</p>
                </div>
                <a th:href="@{/leave}" class="btn btn-outline-secondary">
                    <i class="ph ph-arrow-left me-2"></i>Back to List
                </a>
            </div>

            <!-- Alert Messages -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="ph ph-warning-circle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <div class="col-lg-8 col-xl-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form th:action="@{/leave/save}" th:object="${leaveRequest}" method="post">
                                
                                <!-- Type -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Leave Type</label>
                                    <select class="form-select form-select-lg bg-light border-0" th:field="*{type}">
                                        <option th:each="t : ${leaveTypes}" th:value="${t}" th:text="${t}"></option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                                </div>

                                <!-- Dates -->
                                <div class="row g-3 mb-4">
                                    <div class="col-sm-6">
                                        <label class="form-label fw-semibold">Start Date</label>
                                        <input type="date" class="form-control bg-light border-0" th:field="*{startDate}" />
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label fw-semibold">End Date</label>
                                        <input type="date" class="form-control bg-light border-0" th:field="*{endDate}" />
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                                    </div>
                                </div>

                                <!-- Reason -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Reason</label>
                                    <textarea class="form-control bg-light border-0" th:field="*{reason}" rows="3" placeholder="Optional details about your request..."></textarea>
                                </div>

                                <hr class="my-4 opacity-25">

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/leave}" class="btn btn-light px-4">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="ph ph-paper-plane-tilt me-2"></i> Submit Request
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
