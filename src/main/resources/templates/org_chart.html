<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Organization Chart')}"></head>
<body class="app-body">

<div class="app-shell">
    <th:block th:replace="~{fragments/layout :: sidebar('org-chart')}"></th:block>

    <div class="main-content">
        <th:block th:replace="~{fragments/layout :: topbar('Organization Chart')}"></th:block>

        <main class="content-area">
            <!-- Header -->
            <div class="page-header mb-4">
                <h2 class="h3 mb-1">Organization Chart</h2>
                <p class="text-secondary mb-0">Company hierarchy and reporting structure.</p>
            </div>

            <!-- Org Chart Container -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 overflow-auto d-flex justify-content-center" style="min-height: 500px;">
                    <div id="chart_div">
                        <div class="d-flex align-items-center justify-content-center h-100 text-muted">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Loading organization chart...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Load Google Charts API -->
            <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
            <script type="text/javascript">
                google.charts.load('current', {packages:["orgchart"]});
                google.charts.setOnLoadCallback(drawChart);

                function drawChart() {
                    fetch('/org-chart/api/data')
                        .then(response => response.json())
                        .then(data => {
                            var dataTable = new google.visualization.DataTable();
                            dataTable.addColumn('string', 'Name');
                            dataTable.addColumn('string', 'Manager');
                            dataTable.addColumn('string', 'ToolTip');

                            // Map our JSON data into Google Chart rows
                            var rows = data.map(function(node) {
                                // Create a beautiful HTML node
                                var nodeHtml = `
                                    <div class="org-node">
                                        <div class="fw-bold mb-1">${node.name}</div>
                                        <div class="small text-muted mb-1">${node.title}</div>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.7em;">${node.department}</span>
                                    </div>
                                `;

                                return [
                                    { v: node.id, f: nodeHtml },
                                    node.parentId ? node.parentId : '',
                                    node.title
                                ];
                            });

                            dataTable.addRows(rows);

                            // Create the chart.
                            var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
                            
                            // Draw the chart, setting the allowHtml option to true for the tooltips.
                            chart.draw(dataTable, {
                                allowHtml: true,
                                allowCollapse: true,
                                nodeClass: 'custom-org-node',
                                selectedNodeClass: 'custom-org-selected-node'
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching org chart data:', error);
                            document.getElementById('chart_div').innerHTML = '<div class="text-danger">Failed to load organization chart.</div>';
                        });
                }
            </script>

            <style>
                /* Custom styles for Google Org Chart */
                .custom-org-node {
                    background-color: #ffffff;
                    border: 1px solid #e2e8f0;
                    border-radius: 8px;
                    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
                    padding: 12px 16px;
                    font-family: inherit;
                    min-width: 160px;
                    transition: transform 0.2s, box-shadow 0.2s;
                }
                .custom-org-node:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                    background-color: #f8fafc;
                    border-color: #cbd5e1;
                }
                .custom-org-selected-node {
                    background-color: #f0fdf4 !important;
                    border: 1px solid #4ade80 !important;
                }
                .google-visualization-orgchart-lineleft {
                    border-left: 2px solid #cbd5e1 !important;
                }
                .google-visualization-orgchart-lineright {
                    border-right: 2px solid #cbd5e1 !important;
                }
                .google-visualization-orgchart-linebottom {
                    border-bottom: 2px solid #cbd5e1 !important;
                }
            </style>
        </main>
    </div>
</div>
</body>
</html>
