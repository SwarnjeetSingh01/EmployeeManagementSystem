<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error — EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="error-page">
  <div class="error-code" th:text="${errorCode} ?: '500'">500</div>
  <h1 class="error-title" th:text="${errorTitle} ?: 'Something Went Wrong'">Something Went Wrong</h1>
  <p class="error-message" th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again or contact your administrator.'">
    An unexpected error occurred.
  </p>
  <div style="display:flex;gap:10px;justify-content:center;">
    <a href="javascript:history.back()" class="btn btn-ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
      Go Back
    </a>
    <a href="/dashboard" class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>
  </div>
</div>
</body>
</html>
