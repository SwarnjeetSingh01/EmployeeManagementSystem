<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="error-page">
  <div class="error-code" th:text="${errorCode} ?: '404'">404</div>
  <h1 class="error-title" th:text="${errorTitle} ?: 'Page Not Found'">Page Not Found</h1>
  <p class="error-message" th:text="${errorMessage} ?: 'The page you\'re looking for doesn\'t exist or may have been moved.'">
    The page you're looking for doesn't exist.
  </p>
  <a href="/dashboard" class="btn btn-primary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="15,18 9,12 15,6"/>
    </svg>
    Back to Dashboard
  </a>
</div>
</body>
</html>
