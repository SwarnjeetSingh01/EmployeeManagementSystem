<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Time Off')}"></head>
<body class="app-body">

<div class="app-shell">
    <th:block th:replace="~{fragments/layout :: sidebar('leave')}"></th:block>

    <div class="main-content">
        <th:block th:replace="~{fragments/layout :: topbar('Time Off')}"></th:block>

        <main class="content-area">
            <!-- Header & Actions -->
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h3 mb-1">Time Off</h2>
                    <p class="text-secondary mb-0">Manage your leave requests.</p>
                </div>
                <div>
                    <a th:href="@{/leave/new}" class="btn btn-primary d-inline-flex align-items-center gap-2">
                        <i class="ph ph-calendar-plus"></i> Request Time Off
                    </a>
                </div>
            </div>

            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="ph ph-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Requests Table -->
            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 custom-table">
                        <thead class="table-light">
                        <tr>
                            <th th:if="${currentUser.role.name() != 'ROLE_EMPLOYEE'}">Employee</th>
                            <th>Type</th>
                            <th>Dates</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th th:if="${currentUser.role.name() != 'ROLE_EMPLOYEE'}" class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${requests.empty}">
                            <td th:colspan="${currentUser.role.name() != 'ROLE_EMPLOYEE' ? 6 : 4}" class="text-center py-5 text-muted">
                                <div class="d-flex flex-column align-items-center">
                                    <i class="ph ph-calendar-blank display-4 mb-3 text-secondary"></i>
                                    <p class="mb-0">No time-off requests found.</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="req : ${requests}">
                            <td th:if="${currentUser.role.name() != 'ROLE_EMPLOYEE'}">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                                         style="width: 40px; height: 40px;" th:text="${req.employee.initials}">
                                    </div>
                                    <div>
                                        <h6 class="mb-0 fw-semibold" th:text="${req.employee.name}"></h6>
                                        <small class="text-muted" th:text="${req.employee.email}"></small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${req.type}"></span>
                            </td>
                            <td>
                                <div class="text-nowrap">
                                    <i class="ph ph-calendar-blank text-muted me-1"></i>
                                    <span th:text="${req.startDate}"></span> <i class="ph ph-arrow-right mx-1 text-muted"></i> <span th:text="${req.endDate}"></span>
                                </div>
                            </td>
                            <td>
                                <span class="text-muted text-truncate d-inline-block" style="max-width: 200px;" th:title="${req.reason}" th:text="${req.reason}"></span>
                            </td>
                            <td>
                                <span th:class="'badge ' + (${req.status.name() == 'APPROVED'} ? 'bg-success' : (${req.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning'))"
                                      th:text="${req.status}"></span>
                            </td>
                            <td th:if="${currentUser.role.name() != 'ROLE_EMPLOYEE'}" class="text-end">
                                <div class="btn-group" th:if="${req.status.name() == 'PENDING'}">
                                    <form th:action="@{/leave/approve/{id}(id=${req.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success border-0" title="Approve">
                                            <i class="ph ph-check-circle fs-5"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/leave/reject/{id}(id=${req.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Reject">
                                            <i class="ph ph-x-circle fs-5"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
