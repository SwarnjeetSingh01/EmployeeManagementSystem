<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--/* ── HEAD FRAGMENT ──────────────────────────────────────────────── */-->
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta th:name="_csrf"           th:content="${_csrf.token}">
  <meta th:name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <title th:text="${pageTitle} + ' — EMS'">EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<!--/* ── SIDEBAR FRAGMENT ───────────────────────────────────────────── */-->
<nav th:fragment="sidebar(activePage)" class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon-wrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
      </svg>
    </div>
    <div class="logo-text">
      <span class="logo-title">EMS</span>
      <span class="logo-subtitle">Employee Mgmt System</span>
    </div>
  </div>

  <!-- Nav -->
  <div class="sidebar-section">
    <div class="sidebar-section-label">Menu</div>
    <ul class="sidebar-nav">
      <li>
        <a th:href="@{/dashboard}"
           class="sidebar-nav-item"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a th:href="@{/employees}"
           class="sidebar-nav-item"
           th:classappend="${activePage == 'employees'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Employees</span>
        </a>
      </li>
      <li sec:authorize="hasAnyRole('SUPERADMIN', 'HR')">
        <a th:href="@{/departments}"
           class="sidebar-nav-item"
           th:classappend="${activePage == 'departments'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
          <span>Departments</span>
        </a>
      </li>
      <li>
        <a th:href="@{/leave}"
           class="sidebar-nav-item"
           th:classappend="${activePage == 'leave'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Time Off</span>
        </a>
      </li>
      <li>
        <a th:href="@{/org-chart}"
           class="sidebar-nav-item"
           th:classappend="${activePage == 'org-chart'} ? ' active' : ''">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="5" r="3"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="12" x2="6" y2="16"/>
            <line x1="12" y1="12" x2="18" y2="16"/>
            <circle cx="6" cy="19" r="3"/>
            <circle cx="18" cy="19" r="3"/>
          </svg>
          <span>Org Chart</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Bottom actions -->
  <div class="sidebar-bottom">
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="sidebar-nav-item sidebar-logout" style="width:100%;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Logout</span>
      </button>
    </form>
  </div>
</nav>

<!--/* ── TOPBAR FRAGMENT ────────────────────────────────────────────── */-->
<div th:fragment="topbar(pageTitle)" class="topbar">
  <div class="topbar-left">
    <h1 class="page-title" th:text="${pageTitle}">Dashboard</h1>
  </div>
  <div class="topbar-right">
    <div class="user-pill">
      <div class="user-avatar">AD</div>
      <span class="user-name" sec:authentication="name">admin</span>
    </div>
  </div>
</div>

<!--/* ── SCRIPTS FRAGMENT ───────────────────────────────────────────── */-->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</th:block>

</html>
